<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Método de Costo Mínimo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .tabla-inputs input {
      width: 70px;
      text-align: center;
    }
    .resultado {
      margin-top: 2rem;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">Método de Costo Mínimo (Problema de Transporte)</h2>

    <div class="card p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Número de Orígenes (filas)</label>
          <input type="number" class="form-control" id="filas" min="1" value="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Número de Destinos (columnas)</label>
          <input type="number" class="form-control" id="columnas" min="1" value="0">
        </div>
      </div>
      <div class="mt-3 text-center">
        <button class="btn btn-primary" id="crearMatriz">Crear Matriz</button>
      </div>
    </div>

    <div id="zonaMatriz"></div>

    <div class="resultado" id="resultado"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
